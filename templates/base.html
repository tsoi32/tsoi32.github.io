<script>
document.querySelectorAll('.content .pre-wrap').forEach(function(wrap) {
  var pre = wrap.querySelector('pre');
  if (!pre) return;
  var btn = document.createElement('button');
  btn.className = 'copy-btn';
  btn.textContent = 'copy';
  btn.addEventListener('click', function() {
    var code = pre.querySelector('code');
    navigator.clipboard.writeText(code ? code.innerText : pre.innerText).then(function() {
      btn.textContent = 'copied!';
      btn.classList.add('copied');
      setTimeout(function() { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 1500);
    });
  });
  pre.appendChild(btn);
});
</script>
{{infoModal}}
<script>
(function() {
  var _openModals = 0;
  function bindModal(modalId, triggerId, closeBtnId) {
    var modal    = document.getElementById(modalId);
    var trigger  = document.getElementById(triggerId);
    var closeBtn = document.getElementById(closeBtnId);
    if (!modal || !trigger) return;
    trigger.addEventListener('click', function(e) {
      e.preventDefault();
      modal.classList.add('active');
      modal.setAttribute('aria-hidden', 'false');
      _openModals++;
      document.body.style.overflow = 'hidden';
      document.documentElement.style.overflowY = 'hidden';
    });
    modal.addEventListener('click', function(e) { if (e.target === modal) close(); });
    if (closeBtn) closeBtn.addEventListener('click', close);
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') close(); });
    function close() {
      if (!modal.classList.contains('active')) return;
      modal.classList.remove('active');
      modal.setAttribute('aria-hidden', 'true');
      _openModals = Math.max(0, _openModals - 1);
      if (_openModals === 0) { document.body.style.overflow = ''; document.documentElement.style.overflowY = ''; }
    }
  }
  bindModal('info-modal', 'info-modal-trigger', 'info-modal-close');
})();
</script>
<script>
(function() {
  var current = null;
  document.querySelectorAll('.home-manifesto__band-play').forEach(function(btn) {
    var audio = new Audio(btn.getAttribute('data-audio'));
    audio.preload = 'none';
    audio.addEventListener('ended', function() { btn.textContent = '[>]'; });
    btn.addEventListener('click', function() {
      if (current && current.audio !== audio) {
        current.audio.pause();
        current.audio.currentTime = 0;
        current.btn.textContent = '[>]';
      }
      if (audio.paused) {
        audio.play();
        btn.textContent = '[||]';
        current = { audio: audio, btn: btn };
      } else {
        audio.pause();
        btn.textContent = '[>]';
        current = null;
      }
    });
  });
})();
</script>
